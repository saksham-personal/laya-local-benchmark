[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-local-benchmark"
version = "0.1.0"
description = "Offline CPU benchmark for local Laya routing decisions"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.4.3",
  "onnxruntime==1.24.4",
  "psutil==7.1.3",
  "safetensors==0.8.0",
  "torch==2.9.1",
  "transformers==5.7.0",
]

[project.optional-dependencies]
export = ["onnx", "onnxscript"]
test = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]
